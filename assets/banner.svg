<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for dynamic neon cyber glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f3050" stroke-width="0.7" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.6)); }
      50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.95)); }
    }
    @keyframes hookSwing {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(7deg); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-12px) scale(1.3); opacity: 0.8; }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #00f2fe;
    }
    .pulsing-shield {
      animation: pulseGlow 3.5s ease-in-out infinite;
      transform-origin: 1020px 190px;
    }
    .swinging-hook {
      transform-origin: 1020px 100px;
      animation: hookSwing 4s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: beamFlow 3s linear infinite;
    }
    .radar-circle {
      transform-origin: 1020px 190px;
      animation: radarSpin 12s linear infinite;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="60" r="180" fill="#00f2fe" opacity="0.07" filter="url(#glow)" />
  <circle cx="1020" cy="200" r="220" fill="#7928ca" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Particles -->
  <circle class="particle" cx="120" cy="110" r="3" fill="#00f2fe" style="animation-delay: 0s;" />
  <circle class="particle" cx="480" cy="70" r="2.5" fill="#4facfe" style="animation-delay: 1.2s;" />
  <circle class="particle" cx="620" cy="310" r="3" fill="#ff007f" style="animation-delay: 2.1s;" />
  <circle class="particle" cx="820" cy="80" r="3.5" fill="#00f2fe" style="animation-delay: 0.7s;" />
  <circle class="particle" cx="910" cy="320" r="2" fill="#7928ca" style="animation-delay: 1.8s;" />

  <!-- Dynamic Cyber Circuit Lines -->
  <path d="M 60 40 L 400 40 L 440 80 L 780 80" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4" class="flow-line" />
  <path d="M 60 340 L 520 340 L 560 300 L 880 300" fill="none" stroke="#ff007f" stroke-width="1.8" stroke-opacity="0.35" class="flow-line" style="animation-direction: reverse;" />

  <!-- Left Content: Branding, Badges, Title & Subtitles -->
  <g transform="translate(80, 0)">
    <!-- Security Tag Pill -->
    <g transform="translate(0, 52)">
      <rect width="320" height="30" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="16" cy="15" r="5" fill="#00f2fe">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" class="badge-text">CYBERSECURITY AWARENESS</text>
    </g>

    <!-- Main Title with Gradient Highlight -->
    <g transform="translate(0, 135)">
      <text class="title-text">Awesome Phishing</text>
      <text y="54" class="title-text" fill="url(#primaryGlow)" filter="url(#softGlow)">Simulation Platform</text>
    </g>

    <!-- Subtitle & Meta -->
    <text x="0" y="245" class="subtitle-text">Curated ecosystem of enterprise SaaS suites &amp; open-source toolkits</text>
    <text x="0" y="275" class="subtitle-text" font-size="16" fill="#64748b">Empowering Security Operations, Ethical Red Teams &amp; Human Risk Coaching</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🛡️ Human Risk</text>

      <rect x="142" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a855f7">🎯 SAT Testing</text>

      <rect x="299" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="313" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">⚡ Open Source</text>

      <rect x="446" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="460" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#fb7185">🏢 SaaS Pricing</text>
    </g>
  </g>

  <!-- Right Visual: Dynamic Cyber Shield & Phishing Hook Icon -->
  <g transform="translate(1020, 190)">
    <!-- Radar Scanning Ring -->
    <g class="radar-circle">
      <circle cx="0" cy="0" r="120" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4, 10" />
      <circle cx="0" cy="0" r="90" fill="none" stroke="#7928ca" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="8, 6" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-opacity="0.7" />
    </g>

    <!-- Outer Pulsing Shield Base -->
    <g class="pulsing-shield">
      <path d="M 0 -85 L 68 -50 C 68 25, 38 75, 0 95 C -38 75, -68 25, -68 -50 Z"
            fill="url(#shieldGrad)" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" />
      <!-- Inner Shield Inset -->
      <path d="M 0 -72 L 54 -42 C 54 18, 30 60, 0 76 C -30 60, -54 18, -54 -42 Z"
            fill="#0b1329" fill-opacity="0.9" stroke="#4facfe" stroke-width="1.5" />
    </g>

    <!-- Dynamic Phishing Hook & Security Key Lock Motif -->
    <g class="swinging-hook" transform="translate(0, -10)">
      <!-- Fishing line dropping from top -->
      <line x1="0" y1="-70" x2="0" y2="-20" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="4,4" />
      <!-- Hook curve -->
      <path d="M 0 -20 C 0 18, 26 22, 26 5 C 26 -2, 18 -2, 18 5 C 18 10, 6 10, 6 -20 Z"
            fill="#ffffff" filter="url(#softGlow)" />
      <!-- Hook barb -->
      <polygon points="26,5 20,12 25,14" fill="#00f2fe" />
    </g>

    <!-- Security Checkmark Badge Overlay -->
    <g transform="translate(32, 45)">
      <circle cx="0" cy="0" r="20" fill="#10b981" stroke="#047857" stroke-width="2" filter="url(#softGlow)" />
      <path d="M -7 -1 L -2 5 L 8 -5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
