<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080d1a"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#0a1128"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ff007f"/><stop offset="100%" stop-color="#7928ca"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".9"/><stop offset="100%" stop-color="#7928ca" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f3050" stroke-opacity=".35" stroke-width=".7" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#00f2fe" fill-opacity=".3"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.85;filter:drop-shadow(0 0 10px rgba(0,242,254,.6))}50%{opacity:1;filter:drop-shadow(0 0 25px rgba(0,242,254,.95))}}@keyframes hookSwing{0%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}@keyframes beamFlow{0%{stroke-dashoffset:200}}@keyframes radarSpin{0%{transform:rotate(0deg)}}@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-12px) scale(1.3);opacity:.8}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8;letter-spacing:.3px}.badge-text{font-family:&apos;SF Mono&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace;font-weight:600;font-size:13px;fill:#00f2fe}.pulsing-shield{animation:pulseGlow 3.5s ease-in-out infinite;transform-origin:1020px 190px}.swinging-hook{transform-origin:1020px 100px;animation:hookSwing 4s ease-in-out infinite}.flow-line{stroke-dasharray:12,12;animation:beamFlow 3s linear infinite}.radar-circle{transform-origin:1020px 190px;animation:radarSpin 12s linear infinite}.particle{animation:floatParticle 4s ease-in-out infinite}</style><rect width="1200" height="380" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="380" fill="url(#grid)" rx="16"/><circle cx="150" cy="60" r="180" fill="#00f2fe" filter="url(#glow)" opacity=".07"/><circle cx="1020" cy="200" r="220" fill="#7928ca" filter="url(#glow)" opacity=".12"/><circle cx="120" cy="110" r="3" fill="#00f2fe" class="particle" style="animation-delay:0s"/><circle cx="480" cy="70" r="2.5" fill="#4facfe" class="particle" style="animation-delay:1.2s"/><circle cx="620" cy="310" r="3" fill="#ff007f" class="particle" style="animation-delay:2.1s"/><circle cx="820" cy="80" r="3.5" fill="#00f2fe" class="particle" style="animation-delay:.7s"/><circle cx="910" cy="320" r="2" fill="#7928ca" class="particle" style="animation-delay:1.8s"/><path fill="none" stroke="#00f2fe" stroke-opacity=".4" stroke-width="2" d="M 60 40 L 400 40 L 440 80 L 780 80" class="flow-line"/><path fill="none" stroke="#ff007f" stroke-opacity=".35" stroke-width="1.8" d="M 60 340 L 520 340 L 560 300 L 880 300" class="flow-line" style="animation-direction:reverse"/><g><g transform="translate(80, 0) translate(0, 52)"><rect width="320" height="30" fill="#0f172a" stroke="#00f2fe" stroke-opacity=".6" stroke-width="1.2" filter="url(#softGlow)" rx="15"/><circle cx="16" cy="15" r="5" fill="#00f2fe"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3;1;0.3"/></circle><text x="32" y="20" class="badge-text">CYBERSECURITY AWARENESS</text></g><g><text class="title-text" transform="translate(80, 0) translate(0, 135)">Awesome Phishing</text><text y="54" fill="url(#primaryGlow)" class="title-text" filter="url(#softGlow)" transform="translate(80, 0) translate(0, 135)">Simulation Platform</text></g><text x="0" y="245" class="subtitle-text" transform="translate(80, 0)">Curated ecosystem of enterprise SaaS suites &amp; open-source toolkits</text><text x="0" y="275" fill="#64748b" class="subtitle-text" font-size="16" transform="translate(80, 0)">Empowering Security Operations, Ethical Red Teams &amp; Human Risk Coaching</text><g transform="translate(80, 0) translate(0, 310)"><rect width="130" height="28" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="14" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">🛡️ Human Risk</text><rect width="145" height="28" x="142" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="156" y="18" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">🎯 SAT Testing</text><rect width="135" height="28" x="299" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="313" y="18" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">⚡ Open Source</text><rect width="125" height="28" x="446" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="460" y="18" fill="#fb7185" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">🏢 SaaS Pricing</text></g></g><g><g class="radar-circle" transform="translate(1020, 190)"><circle cx="0" cy="0" r="120" fill="none" stroke="#00f2fe" stroke-dasharray="4 10" stroke-opacity=".2" stroke-width="1"/><circle cx="0" cy="0" r="90" fill="none" stroke="#7928ca" stroke-dasharray="8 6" stroke-opacity=".3" stroke-width="1.2"/><line x1="0" x2="120" y1="0" y2="0" stroke="url(#primaryGlow)" stroke-opacity=".7" stroke-width="1.5"/></g><g class="pulsing-shield"><path fill="url(#shieldGrad)" stroke="#00f2fe" stroke-width="3" d="M 0 -85 L 68 -50 C 68 25, 38 75, 0 95 C -38 75, -68 25, -68 -50 Z" filter="url(#glow)" transform="translate(1020, 190)"/><path fill="#0b1329" fill-opacity=".9" stroke="#4facfe" stroke-width="1.5" d="M 0 -72 L 54 -42 C 54 18, 30 60, 0 76 C -30 60, -54 18, -54 -42 Z" transform="translate(1020, 190)"/></g><g class="swinging-hook" transform="translate(1020, 190) translate(0, -10)"><line x1="0" x2="0" y1="-70" y2="-20" stroke="#00f2fe" stroke-dasharray="4 4" stroke-width="2.5"/><path fill="#fff" d="M 0 -20 C 0 18, 26 22, 26 5 C 26 -2, 18 -2, 18 5 C 18 10, 6 10, 6 -20 Z" filter="url(#softGlow)"/><polygon fill="#00f2fe" points="26 5 20 12 25 14"/></g><g transform="translate(1020, 190) translate(32, 45)"><circle cx="0" cy="0" r="20" fill="#10b981" stroke="#047857" stroke-width="2" filter="url(#softGlow)"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M -7 -1 L -2 5 L 8 -5"/></g></g></svg>